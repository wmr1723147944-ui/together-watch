<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; form-action 'none'; frame-src 'none'">
<title>一起看 · Windows</title><link rel="stylesheet" href="shell.css"></head><body>
<header><div class="brand"><span class="mark">▶</span><div>一起看<small>WINDOWS · 0.4.0 测试版</small></div></div><span id="status" role="status">先找好片，再邀请朋友。</span><button id="settings">返回首页</button></header>
<section id="setup"><p class="eyebrow">WATCH TOGETHER</p><h1>把今晚的片刻，<br>留给一起看的人。</h1><p class="intro">不用插件，不用书签。打开视频，邀请朋友，边看边聊。</p>
<form id="startForm"><div class="fields"><label>你的昵称<input id="nickname" maxlength="32" value="观影成员" required></label><label>收到朋友的邀请？粘贴在这里<input id="room" maxlength="256" placeholder="粘贴邀请即可跟随，不需要视频链接"></label></div>
<label>已有视频链接？也可以先留空<input id="source" type="url" maxlength="4096" placeholder="留空进入软件内找片，也可粘贴 HTTPS 播放页"></label>
<div class="samples"><span>先试一段公开短片</span><button type="button" data-sample="sintel">Sintel</button><button type="button" data-sample="bunny">Big Buck Bunny</button></div>
<label class="consent"><input id="consent" type="checkbox" required>我同意<a href="https://watchtogethernow.cloud/terms" id="terms">用户协议</a>与<a href="https://watchtogethernow.cloud/privacy" id="privacy">隐私政策</a>，只同步本人有权观看的内容。</label>
<button class="primary" type="submit" id="start">先找片，选好再建房 →</button><p id="error" role="alert"></p></form>
<p class="hint">搜索 → 选集建房 → 复制邀请。朋友在新版客户端输入邀请即可跟随。会员内容需各自登录；动态选集站点可能仍需核对集数。</p></section>
<section id="tools" hidden><form id="sourceForm"><button id="discover" type="button">找片 / 选集</button><button id="return-video" type="button">回到播放</button><input id="currentSource" aria-label="视频网页地址" type="url" required><button type="submit">打开链接</button><button id="back" type="button">后退</button><button id="reload" type="button">刷新</button></form><nav><span id="roomLabel"></span><button id="kanju">看剧 AI</button><button id="pick-current" hidden>用当前页换片</button><button id="cinema">影院 / 网页</button><button id="invite">复制邀请</button><button id="detect">重连同步</button><button id="fullscreen">全屏 · F11</button></nav>
<div class="media-tools"><span id="modeLabel">原网页</span><button id="scan-media">识别视频</button><select id="mediaChoices" aria-label="当前页面识别到的视频"><option value="">先播放网页视频，再识别</option></select><button id="play-media" disabled>内置播放</button><button id="original">原网页</button></div></section>
<section id="finderTools" hidden><div><strong>找好片，再建房</strong><span>选择具体集数后自动创建房间</span></div><nav><button id="finder-catalog">多站搜片 / 选集</button><button id="finder-kanju">看剧 AI · 原站搜索</button><button id="finder-pick">用当前播放页建房</button></nav><p>看剧 AI 保留原站搜索与登录，未标成已验证片源；动态选集不保证自动选中同一集。</p></section>
<div id="placeholder" hidden>正在加载播放页和房间…</div><script src="shell.js"></script></body></html>
