plugins {
    id "com.android.application"
}

android {
    namespace "cloud.watchtogethernow.mobile"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "cloud.watchtogethernow.mobile"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "0.2.1"

        buildConfigField "String", "SERVER_ORIGIN", '"https://watchtogethernow.cloud"'
        buildConfigField "String", "LEGAL_NOTICE_VERSION", '"2026-07-28"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    testImplementation "junit:junit:4.13.2"
}
