<form id="discoveryForm" class="catalog-search" action="/discover" method="get" role="search">
    <label class="sr-only" for="discoveryQuery">搜索电影、剧集或动漫</label>
    <input id="discoveryQuery" name="q" type="search" maxlength="80" value="{{ discovery_query }}" placeholder="搜索电影、剧集、动漫" autocomplete="off">
    <button id="discoveryClear" type="button" hidden aria-label="清空搜索，返回推荐">×</button>
    <button class="catalog-search-submit" type="submit" aria-label="搜索影片"><svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span>搜索</span></button>
</form>
