<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together Watch - 多人同步观影</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="landing-container">
        <main class="glass-panel landing-panel">
            <h1 class="title">Together Watch</h1>
            <p class="landing-subtitle">创建一个私人放映间，把邀请链接发给朋友就能一起看</p>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label class="field-label" for="username">你的昵称</label>
                    <input type="text" id="username" placeholder="例如：小雨" required maxlength="32" autocomplete="nickname">
                </div>
                <div class="input-group">
                    <label class="field-label" for="roomId">加入已有房间（可选）</label>
                    <input type="text" id="roomId" placeholder="粘贴邀请链接或输入房间号" maxlength="300" autocomplete="off">
                </div>
                <p id="formError" class="form-error" role="alert" aria-live="polite"></p>
                <div class="landing-actions">
                    <button type="button" id="createRoomBtn" class="btn">＋ 创建新房间</button>
                    <button type="submit" id="joinRoomBtn" class="btn btn-secondary">加入已有房间</button>
                </div>
            </form>
            <p class="privacy-tip">无需上传视频。每位成员仍在原网站使用自己的观看权限，本站只同步播放状态。</p>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
</body>
</html>
