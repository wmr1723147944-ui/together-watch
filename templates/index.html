<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together Watch - 多人同步观影</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="landing-container">
        <main class="glass-panel landing-panel">
            <h1 class="title">Together Watch</h1>
            <p class="landing-subtitle">粘贴官方视频网页，只同步播放状态，不搬运视频内容</p>

            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label class="field-label" for="username">你的昵称</label>
                    <input type="text" id="username" placeholder="例如：小雨" required maxlength="32" autocomplete="nickname">
                </div>
                <div class="input-group">
                    <label class="field-label" for="roomId">房间号</label>
                    <div class="input-inline">
                        <input type="text" id="roomId" placeholder="输入已有房间号" required minlength="4" maxlength="64" autocomplete="off">
                        <button type="button" id="generateRoomBtn" class="btn btn-secondary btn-compact">随机生成</button>
                    </div>
                </div>
                <p id="formError" class="form-error" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn btn-block">进入房间</button>
            </form>
            <p class="privacy-tip">每位成员在原网站使用自己的正常观看权限；本站不会提取会员凭证或中转影片。</p>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}" defer></script>
</body>
</html>
