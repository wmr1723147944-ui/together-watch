services:
  - type: web
    name: together-watch-personal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: personal-v1
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: AUTHORIZED_MEDIA_HOSTS
        value: ""
      - key: AUTHORIZED_PAGE_HOSTS
        value: ""
      - key: SERVICE_OPERATOR_NAME
        value: ""
      - key: COPYRIGHT_CONTACT_EMAIL
        value: ""
      - key: ROOM_TTL_SECONDS
        value: "21600"
      - key: MAX_ROOM_MEMBERS
        value: "50"
      - key: MAX_CALL_MEMBERS
        value: "8"
      - key: GUNICORN_THREADS
        value: "40"
